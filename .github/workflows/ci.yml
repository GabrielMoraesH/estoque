name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: "3001"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: estoque_med_ci
      DB_USER: ci_user
      DB_PASSWORD: ci-password-not-for-production
      JWT_SECRET: test-ci-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate coverage report
        run: npm test -- --coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      REACT_APP_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Generate coverage report
        run: npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Build production bundle
        run: npm run build

  production-docker:
    name: Production Docker
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_CI_ENV_FILE: .env.production.ci
      EDGE_HTTP_PORT: "8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create disposable production environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            'POSTGRES_DB=estoque_med_ci_test' \
            'POSTGRES_USER=estoque_ci' \
            'POSTGRES_PASSWORD=QG7K-ci-only-Postgres-2026!' \
            'JWT_SECRET=QG7K-ci-only-JWT-secret-2026-with-entropy' \
            'CORS_ORIGIN=http://127.0.0.1:8080' \
            'EDGE_HTTP_PORT=8080' \
            'BOOTSTRAP_ADMIN_LOGIN=qg7k.ci.admin' \
            'BOOTSTRAP_ADMIN_PASSWORD=QG7K-ci-only-Admin-2026!' \
            > "$PRODUCTION_CI_ENV_FILE"

      - name: Validate production Docker stack
        shell: bash
        run: bash deploy/scripts/validate-production-docker.sh "$PRODUCTION_CI_ENV_FILE"

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker compose --env-file "$PRODUCTION_CI_ENV_FILE" -f docker-compose.prod.yml ps --all
          docker compose --env-file "$PRODUCTION_CI_ENV_FILE" -f docker-compose.prod.yml logs --no-color > docker-compose-production.log
          cat docker-compose-production.log

      - name: Upload production Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-docker-logs
          path: docker-compose-production.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop production Docker stack
        if: always()
        shell: bash
        run: |
          set +e
          docker compose --env-file "$PRODUCTION_CI_ENV_FILE" -f docker-compose.prod.yml down
          rm -f -- "$PRODUCTION_CI_ENV_FILE"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estoque_med_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: "3001"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: estoque_med_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations on an empty database
        run: npm run migrate

      - name: Verify migrations are idempotent
        run: npm run migrate

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estoque_med_e2e_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: "3001"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: estoque_med_e2e_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: e2e-test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        working-directory: backend
        run: npm run migrate
      - name: Prepare E2E fixture
        working-directory: backend
        run: npm run seed:e2e
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
